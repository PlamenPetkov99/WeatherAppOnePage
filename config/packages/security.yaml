security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            logout:
                path: app_logout
                target: app_index
                invalidate_session:   true
                enable_csrf: true
            remember_me:
                secret: '%kernel.secret%'
            custom_authenticator:
                - App\Security\CustomLoginAuthenticator
            entry_point: App\Security\CustomLoginAuthenticator
            two_factor:
                check_path: /2fa_check
                post_only: true
                auth_form_path: /2fa
                auth_code_parameter_name: code
                enable_csrf: true

    access_control:
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/register, roles: PUBLIC_ACCESS }
    - { path: ^/logout, roles: PUBLIC_ACCESS }
    - { path: ^/2fa, roles: PUBLIC_ACCESS }
    - { path: ^/authenticate/2fa_backup, roles: PUBLIC_ACCESS }
    - { path: ^/authenticate, roles: ROLE_USER }
    - { path: ^/dashboard, roles: ROLE_USER }
    - { path: ^/profile, roles: ROLE_USER }
    - { path: ^/profile/edit, roles: ROLE_USER }
    - { path: ^/profile/password, roles: ROLE_USER }
    - { path: ^/$, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
